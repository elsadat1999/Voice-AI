[general]
static=yes
writeprotect=no

[default]
; ======================================================
; 1. AI Voice Agent Extensions
; ======================================================
; Direct to Carts Agent (سلات متروكة)
exten => 98,1,NoOp(=== Call to AI Voice Agent (carts) from ${CALLERID(all)} ===)
 same => n,Set(AI_AGENT=carts)
 same => n,ExecIf($["${TEST_CALL_MAX_DURATION}" != ""]?Set(TIMEOUT(absolute)=${TEST_CALL_MAX_DURATION}))
 same => n,Answer()
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()

; Direct to Sales Agent (سارة المبيعات)
exten => 99,1,NoOp(=== Call to AI Voice Agent (sales_agent) from ${CALLERID(all)} ===)
 same => n,Set(AI_AGENT=sales_agent)
 same => n,Answer()
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()

; Default AI Voice Agent (Dial 100 or 0 or 999)
exten => 100,1,NoOp(=== Call to Default AI Voice Agent from ${CALLERID(all)} ===)
 same => n,Answer()
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()

exten => 0,1,NoOp(=== Shortcut 0 to AI Voice Agent ===)
 same => n,Goto(default,100,1)

exten => 999,1,NoOp(=== Shortcut 999 to AI Voice Agent ===)
 same => n,Goto(default,100,1)

; ======================================================
; 2. Echo Test (Dial *43 or 43 to test microphone & audio)
; ======================================================
exten => 43,1,NoOp(=== Echo Test for ${CALLERID(num)} ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(beep)
 same => n,Echo()
 same => n,Hangup()

exten => *43,1,Goto(default,43,1)

; ======================================================
; 3. Person-to-Person Calls (Dial 1001 - 1099)
; ======================================================
exten => _10XX,1,NoOp(=== Person-to-Person: ${CALLERID(num)} calling Extension ${EXTEN} ===)
 same => n,Set(TARGET_CONTACTS=${PJSIP_DIAL_CONTACTS(${EXTEN})})
 same => n,GotoIf($["${TARGET_CONTACTS}" = ""]?offline:dial)
 same => n(dial),Dial(${TARGET_CONTACTS},30,tT)
 same => n,NoOp(Call ended with status: ${DIALSTATUS})
 same => n,Goto(dial-${DIALSTATUS},1)
 same => n(offline),NoOp(Extension ${EXTEN} is NOT registered / offline)
 same => n,Answer()
 same => n,Playtones(congestion)
 same => n,Wait(2)
 same => n,Hangup()

exten => dial-NOANSWER,1,NoOp(Extension ${EXTEN} did not answer)
 same => n,Playtones(congestion)
 same => n,Wait(2)
 same => n,Hangup()

exten => dial-BUSY,1,NoOp(Extension ${EXTEN} is busy)
 same => n,Playtones(busy)
 same => n,Wait(2)
 same => n,Hangup()

exten => dial-CHANUNAVAIL,1,NoOp(Extension ${EXTEN} is offline or unavailable)
 same => n,Playtones(congestion)
 same => n,Wait(2)
 same => n,Hangup()

exten => _dial-.,1,Hangup()

; ======================================================
; 4. Outbound Trunk Routing (Zadarma)
; ======================================================
include => outbound-zadarma

; ======================================================
; 5. Public / Untrusted Context (Security Hardened)
; ======================================================
[public]
; Block all unauthenticated scanner / bot calls immediately
exten => _.,1,NoOp(=== SECURITY: Blocked unauthorized public call to ${EXTEN} from ${CALLERID(all)} ===)
 same => n,Hangup(21)

; ======================================================
; 6. Outbound Trunk Routing Context (Zadarma with CallerID)
; ======================================================
[outbound-zadarma]
; Saudi local mobile numbers (05XXXXXXXX -> 009665XXXXXXXX)
exten => _05XXXXXXXX,1,NoOp(=== Outbound call to Saudi Mobile: ${EXTEN} ===)
 same => n,Set(TARGET_NUM=00966${EXTEN:1})
 same => n,Set(CALLERID(num)=12262715509)
 same => n,Set(CALLERID(name)=Sara Ahmed)
 same => n,Dial(PJSIP/${TARGET_NUM}@zadarma,60,r)
 same => n,Hangup()

; Saudi numbers with +966
exten => _+966.,1,NoOp(=== Outbound call to +966: ${EXTEN} ===)
 same => n,Set(TARGET_NUM=00${EXTEN:1})
 same => n,Set(CALLERID(num)=12262715509)
 same => n,Set(CALLERID(name)=Sara Ahmed)
 same => n,Dial(PJSIP/${TARGET_NUM}@zadarma,60,r)
 same => n,Hangup()

; Saudi numbers with 00966
exten => _00966.,1,NoOp(=== Outbound call to 00966: ${EXTEN} ===)
 same => n,Set(TARGET_NUM=${EXTEN})
 same => n,Set(CALLERID(num)=12262715509)
 same => n,Set(CALLERID(name)=Sara Ahmed)
 same => n,Dial(PJSIP/${TARGET_NUM}@zadarma,60,r)
 same => n,Hangup()

; Saudi numbers starting with 966
exten => _966.,1,NoOp(=== Outbound call to 966: ${EXTEN} ===)
 same => n,Set(TARGET_NUM=00${EXTEN})
 same => n,Set(CALLERID(num)=12262715509)
 same => n,Set(CALLERID(name)=Sara Ahmed)
 same => n,Dial(PJSIP/${TARGET_NUM}@zadarma,60,r)
 same => n,Hangup()

; General international numbers with + (e.g. +1, +20, +971...)
exten => _+.,1,NoOp(=== Outbound international call with +: ${EXTEN} ===)
 same => n,Set(TARGET_NUM=00${EXTEN:1})
 same => n,Set(CALLERID(num)=12262715509)
 same => n,Set(CALLERID(name)=Sara Ahmed)
 same => n,Dial(PJSIP/${TARGET_NUM}@zadarma,60,r)
 same => n,Hangup()

; General international numbers with 00
exten => _00.,1,NoOp(=== Outbound international call with 00: ${EXTEN} ===)
 same => n,Set(TARGET_NUM=${EXTEN})
 same => n,Set(CALLERID(num)=12262715509)
 same => n,Set(CALLERID(name)=Sara Ahmed)
 same => n,Dial(PJSIP/${TARGET_NUM}@zadarma,60,r)
 same => n,Hangup()

; Any other 8+ digit numbers (likely phone numbers)
exten => _[1-9]XXXXXXX.,1,NoOp(=== Outbound call (8+ digits): ${EXTEN} ===)
 same => n,Set(TARGET_NUM=00${EXTEN})
 same => n,Set(CALLERID(num)=12262715509)
 same => n,Set(CALLERID(name)=Sara Ahmed)
 same => n,Dial(PJSIP/${TARGET_NUM}@zadarma,60,r)
 same => n,Hangup()

; ======================================================
; 7. from-internal Context (For AVA Outbound Dialing & Extensions)
; ======================================================
[from-internal]
include => default
include => outbound-zadarma

; ======================================================
; 8. AAVA Answering Machine Detection (AMD) hop
; ======================================================
[aava-outbound-amd]
exten => s,1,NoOp(=== AAVA Outbound AMD hop ===)
 same => n,NoOp(Attempt=${AAVA_ATTEMPT_ID} Campaign=${AAVA_CAMPAIGN_ID} Lead=${AAVA_LEAD_ID})
 same => n,ExecIf($["${AAVA_AMD_OPTS}" = ""]?Set(AAVA_AMD_OPTS=2000,2000,1000,5000,100,50,10))
 same => n,AMD(${AAVA_AMD_OPTS})
 same => n,NoOp(AMDSTATUS=${AMDSTATUS} AMDCAUSE=${AMDCAUSE})
 same => n,GotoIf($["${AMDCAUSE:0:7}" = "TOOLONG"]?human)
 same => n,GotoIf($["${AMDCAUSE:0:14}" = "INITIALSILENCE"]?human)
 same => n,GotoIf($["${AMDSTATUS}" = "HUMAN"]?human)
 same => n,GotoIf($["${AMDSTATUS}" = "NOTSURE"]?machine)
 same => n(machine),GotoIf($["${AAVA_VM_ENABLED}" = "1"]?vm:machine_done)
 same => n(vm),WaitForSilence(1500,3,10)
 same => n(machine_done),Stasis(asterisk-ai-voice-agent,outbound_amd,${AAVA_ATTEMPT_ID},MACHINE,${AMDCAUSE},,)
 same => n,Hangup()
 same => n(human),GotoIf($["${AAVA_CONSENT_ENABLED}" = "1"]?consent:human_done)
 same => n(consent),Set(TIMEOUT(response)=${IF($["${AAVA_CONSENT_TIMEOUT}"=""]?5:${AAVA_CONSENT_TIMEOUT})})
 same => n,Read(AAVA_CONSENT_DTMF,${AAVA_CONSENT_PLAYBACK},1)
 same => n,GotoIf($["${AAVA_CONSENT_DTMF}" = "1"]?human_ok)
 same => n,GotoIf($["${AAVA_CONSENT_DTMF}" = "2"]?human_denied)
 same => n(human_timeout),Stasis(asterisk-ai-voice-agent,outbound_amd,${AAVA_ATTEMPT_ID},HUMAN,${AMDCAUSE},,timeout)
 same => n,Hangup()
 same => n(human_denied),Stasis(asterisk-ai-voice-agent,outbound_amd,${AAVA_ATTEMPT_ID},HUMAN,${AMDCAUSE},,denied)
 same => n,Hangup()
 same => n(human_ok),Stasis(asterisk-ai-voice-agent,outbound_amd,${AAVA_ATTEMPT_ID},HUMAN,${AMDCAUSE},,accepted)
 same => n,Hangup()
 same => n(human_done),Stasis(asterisk-ai-voice-agent,outbound_amd,${AAVA_ATTEMPT_ID},HUMAN,${AMDCAUSE},,)
 same => n,Hangup()
