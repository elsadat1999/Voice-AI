<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Modern App Icon Container -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Subtle glow layer -->
  <path d="M 22 60 L 44 60 L 58 26 L 74 94 L 84 60 L 98 60" 
        stroke="url(#pulseGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#glow)"/>

  <!-- Crisp Core Voice Pulse Waveform -->
  <path d="M 22 60 L 44 60 L 58 26 L 74 94 L 84 60 L 98 60" 
        stroke="url(#pulseGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>